<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供應鏈管理系 公開課表 115-2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#0f1117; --bg2:#161b27; --surface:#232b3e; --surface2:#2a3349;
  --border:#2e3855; --border2:#3d4f6e;
  --text:#e8eaf2; --text2:#9ba5c0; --text3:#6070a0;
  --accent:#4f8ef7; --accent2:#7ab3ff;
  --gold:#f0b84a; --green:#3ecf8e; --red:#f56565; --red2:#fc8585;
  --purple:#a78bfa; --teal:#2dd4bf;
  --day-c:#4f8ef7; --eve-c:#f0b84a; --grad-c:#3ecf8e; --prof-c:#a78bfa;
  --col-w:116px; --row-h:52px; --label-w:72px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:15px;}

/* ── APP SHELL ── */
.app{display:flex;height:100vh;overflow:hidden;}

/* ── LEFT SIDEBAR ── */
.sidebar{width:300px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-header{padding:11px 13px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.sb-title{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;}
.class-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:7px 9px;border-bottom:1px solid var(--border);flex-shrink:0;}
.class-tab{font-size:12px;padding:4px 9px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .12s;font-family:inherit;}
.class-tab:hover{border-color:var(--border2);color:var(--text);}
.class-tab.active{color:#fff;border-color:transparent;}
.class-tab[data-type="day"].active{background:var(--day-c);}
.class-tab[data-type="eve"].active{background:#a37a10;}
.class-tab[data-type="grad"].active{background:#2a9e6b;}
.class-tab[data-type="prof"].active{background:#7c5dcc;}
.course-list{flex:1;overflow-y:auto;padding:5px;}
.course-list::-webkit-scrollbar{width:3px;}
.course-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.course-item{padding:7px 9px;border-radius:7px;margin-bottom:3px;cursor:grab;border:1px solid var(--border);background:var(--surface);transition:all .12s;user-select:none;position:relative;}
.course-item:hover{border-color:var(--border2);background:var(--surface2);}
.course-item.dragging{opacity:.4;}
.course-item.placed{opacity:.38;cursor:not-allowed;}
.course-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;line-height:1.3;}
.course-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
.course-teacher{font-size:11px;color:var(--text3);}
.tag{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:500;}
.tag-req{background:rgba(79,142,247,.15);color:var(--accent2);}
.tag-sel{background:rgba(240,184,74,.12);color:var(--gold);}
.tag-cred{background:rgba(255,255,255,.06);color:var(--text2);font-family:'DM Mono',monospace;}
.placed-badge{position:absolute;right:6px;top:5px;font-size:9px;color:var(--green);}

.add-course-btn{margin:6px 9px 4px;padding:6px 10px;border-radius:6px;border:1px dashed var(--border2);background:transparent;color:var(--text3);font-size:11px;cursor:pointer;width:calc(100% - 18px);text-align:left;font-family:inherit;transition:all .12s;}
.add-course-btn:hover{color:var(--accent2);border-color:var(--accent);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.header{padding:11px 18px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.header-title{font-size:14px;font-weight:700;letter-spacing:.04em;}
.header-sub{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}
.status-pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid;}
.status-pill.ok{color:var(--green);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08);}
.status-pill.warn{color:var(--red2);border-color:rgba(245,101,101,.3);background:rgba(245,101,101,.08);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.btn{white-space:nowrap;padding:5px 13px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:inherit;transition:all .12s;}
.btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--accent2);}
.btn.primary{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent2);}
.btn.danger{background:rgba(245,101,101,.1);border-color:var(--red);color:var(--red2);}
.spacer{flex:1;}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;}
.vt-btn{white-space:nowrap;padding:5px 13px;font-size:12px;cursor:pointer;background:transparent;color:var(--text3);border:none;font-family:inherit;transition:all .12s;}
.vt-btn.active{background:var(--surface2);color:var(--text);}

.legend{display:flex;gap:11px;padding:0 16px;align-items:center;height:27px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.li{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--text3);}
.ld{width:8px;height:8px;border-radius:2px;}

/* ── CONTENT AREA ── */
.content-row{flex:1;display:flex;overflow:hidden;}

/* ── GRID (class view) ── */
.grid-area{flex:1;overflow:auto;padding:13px 16px 16px;}
.grid-area::-webkit-scrollbar{width:5px;height:5px;}
.grid-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.grid-section-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;padding-left:var(--label-w);}
.timetable-wrap{display:flex;flex-direction:column;gap:2px;}
.tt-header-row{display:flex;gap:2px;padding-left:var(--label-w);margin-bottom:2px;}
.tt-day-hdr{width:var(--col-w);text-align:center;font-size:13px;font-weight:600;color:var(--text2);padding:3px 0;letter-spacing:.04em;}
.tt-period-row{display:flex;gap:2px;}
.period-label{width:var(--label-w);min-width:var(--label-w);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:7px;}
.period-label .pnum{font-size:13px;font-weight:600;color:var(--text2);font-family:'DM Mono',monospace;}
.period-label .ptime{font-size:10px;color:var(--text3);}
.day-cell{width:var(--col-w);position:relative;}
.slot-block{position:absolute;left:0;right:0;top:0;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--surface);z-index:1;}
.slot-block.empty{height:var(--row-h);cursor:pointer;transition:border-color .12s,background .12s;}
.slot-block.empty:hover,.slot-block.empty.dragover{border-color:var(--accent);background:rgba(79,142,247,.1);}
.slot-block.conflict{border-color:var(--red)!important;background:rgba(245,101,101,.08)!important;}
.noon-row{height:9px;}
.noon-slot{height:9px;background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:3px;}
.course-card{position:absolute;inset:2px;border-radius:4px;padding:4px 7px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.cc-day{background:rgba(79,142,247,.22);color:#b8d4ff;}
.cc-eve{background:rgba(240,184,74,.22);color:#ffd98a;}
.cc-grad{background:rgba(62,207,142,.22);color:#9dffce;}
.cc-prof{background:rgba(167,139,250,.22);color:#d0bbff;}
.cc-custom{background:rgba(255,255,255,.1);color:#dde0ee;}
.cc-name{font-size:12px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.cc-teacher{font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cc-credits{font-size:10px;opacity:.6;font-family:'DM Mono',monospace;margin-top:1px;}
.cc-remove{position:absolute;top:3px;right:4px;width:14px;height:14px;font-size:11px;line-height:14px;text-align:center;cursor:pointer;opacity:0;transition:opacity .1s;border-radius:3px;background:rgba(0,0,0,.45);}
.slot-block:hover .cc-remove{opacity:1;}

/* ── TEACHER VIEW ── */
.teacher-grid-area{flex:1;overflow:auto;padding:13px 16px 16px;}
.teacher-grid-area::-webkit-scrollbar{width:5px;height:5px;}
.teacher-grid-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.teacher-selector{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.teacher-chip{font-size:11px;padding:3px 8px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .12s;font-family:inherit;}
.teacher-chip:hover{border-color:var(--border2);color:var(--text);}
.teacher-chip.active{background:rgba(79,142,247,.18);border-color:var(--accent);color:var(--accent2);}
.teacher-chip.has-conflict{border-color:var(--red);color:var(--red2);}
/* Teacher timetable uses same slot/card classes but cols = 6 days (Mon-Sat) */
.tt-teacher .tt-day-hdr{width:var(--col-w);}
.tt-teacher .day-cell{width:var(--col-w);}

/* ── TEACHER LOAD PANEL ── */
.teacher-panel{width:248px;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;}
.teacher-panel-hd{padding:8px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.teacher-list{flex:1;overflow-y:auto;padding:4px;}
.teacher-list::-webkit-scrollbar{width:3px;}
.teacher-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.teacher-row{padding:5px 7px;border-radius:5px;display:flex;align-items:center;gap:7px;border:1px solid transparent;}
.teacher-row:hover{background:var(--surface);}
.teacher-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.teacher-info{flex:1;min-width:0;}
.teacher-name-row{font-size:11px;font-weight:500;}
.teacher-load-txt{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;}
.load-bg{height:2px;background:var(--border);border-radius:1px;margin-top:3px;}
.load-fill{height:2px;border-radius:1px;transition:width .3s;}

/* ── BOTTOM ── */
.bottom-panel{height:155px;border-top:1px solid var(--border);background:var(--bg2);display:flex;flex-shrink:0;}
.conflict-panel{flex:1;overflow-y:auto;padding:7px 13px;}
.conflict-panel::-webkit-scrollbar{width:3px;}
.conflict-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.conflict-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.conflict-item{font-size:11px;color:var(--red2);padding:3px 0;border-bottom:1px solid rgba(245,101,101,.1);display:flex;gap:5px;line-height:1.4;}
.conflict-item::before{content:'⚠';font-size:10px;flex-shrink:0;margin-top:1px;}
.no-conflict{font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px;margin-top:14px;}
.stats-panel{width:186px;border-left:1px solid var(--border);padding:7px 11px;}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.sl{color:var(--text3);}
.sv{font-weight:600;font-family:'DM Mono',monospace;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:20px 22px;width:380px;max-width:96vw;}
.modal-title{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text);}
.form-row{margin-bottom:12px;}
.form-label{font-size:11px;color:var(--text3);margin-bottom:4px;display:block;}
.form-input,.form-select{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .12s;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* ── TOAST & TIP ── */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 16px;font-size:12px;color:var(--text);z-index:4000;transition:transform .22s cubic-bezier(.34,1.56,.64,1);pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:7px 11px;font-size:11px;color:var(--text);pointer-events:none;z-index:2000;display:none;max-width:200px;box-shadow:0 4px 18px rgba(0,0,0,.5);}
.tooltip.on{display:block;}

/* ── TEACHER TAG-INPUT ── */
.teacher-tag-input-wrap{
  border:1px solid var(--border2);border-radius:6px;background:var(--surface);
  min-height:36px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:4px;
  cursor:text;transition:border-color .12s;
}
.teacher-tag-input-wrap:focus-within{border-color:var(--accent);}
.teacher-tag{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(79,142,247,.18);color:var(--accent2);
  font-size:11px;padding:2px 7px 2px 8px;border-radius:4px;
  white-space:nowrap;
}
.teacher-tag .tag-x{
  cursor:pointer;font-size:12px;opacity:.7;line-height:1;
  padding:0 1px;transition:opacity .1s;
}
.teacher-tag .tag-x:hover{opacity:1;}
.teacher-search-input{
  flex:1;min-width:80px;background:transparent;border:none;outline:none;
  color:var(--text);font-size:12px;font-family:inherit;padding:2px 4px;
}
.teacher-dropdown{
  position:absolute;left:0;right:0;top:calc(100% + 4px);
  background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
  z-index:500;overflow:hidden;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-height:200px;overflow-y:auto;
}
.teacher-dropdown.open{display:block;}
.teacher-dropdown::-webkit-scrollbar{width:3px;}
.teacher-dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.td-item{
  padding:7px 12px;font-size:12px;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:background .1s;
}
.td-item:hover{background:var(--surface2);}
.td-item.add-new{color:var(--accent2);font-style:italic;}
.td-item .td-type{font-size:10px;color:var(--text3);margin-left:auto;}
#teacher-mgr-body tr{border-bottom:1px solid var(--border);transition:background .1s;}
#teacher-mgr-body tr:last-child{border-bottom:none;}
#teacher-mgr-body tr:hover{background:var(--surface);}
#teacher-mgr-body td{padding:6px 12px;font-size:12px;vertical-align:middle;}
.tmgr-input{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:3px 7px;font-family:inherit;outline:none;width:100%;}
.tmgr-input:focus{border-color:var(--accent);}
.tmgr-select{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:11px;padding:3px 6px;font-family:inherit;outline:none;}
.tmgr-select:focus{border-color:var(--accent);}
.icon-btn{background:transparent;border:none;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;color:var(--text3);transition:all .12s;}
.icon-btn:hover{background:var(--surface2);color:var(--text);}
.icon-btn.del:hover{color:var(--red2);}
/* delete btn on course items */
.course-del-btn{position:absolute;right:6px;bottom:5px;font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:transparent;font-family:inherit;transition:all .12s;}
.course-del-btn:hover{color:var(--red2);border-color:var(--red);}
.course-edit-btn{position:absolute;right:44px;bottom:5px;font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:transparent;font-family:inherit;transition:all .12s;}
.course-edit-btn:hover{color:var(--accent2);border-color:var(--accent);}

/* ── CLASSROOM VIEW ── */
.room-selector{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.room-chip{font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .12s;font-family:inherit;}
.room-chip:hover{border-color:var(--border2);color:var(--text);}
.room-chip.active{background:rgba(45,212,191,.15);border-color:var(--teal);color:var(--teal);}
.room-chip.has-conflict{border-color:var(--red);color:var(--red2);}
.cc-room{background:rgba(45,212,191,.18);color:#7ffff4;}
.room-badge{display:inline-block;font-size:9px;background:rgba(45,212,191,.15);color:var(--teal);border-radius:3px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

/* ── ROOM PICKER POPUP ── */
.room-picker{position:fixed;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;z-index:5000;min-width:240px;box-shadow:0 8px 32px rgba(0,0,0,.6);display:none;}
.room-picker.open{display:block;}
.room-picker-title{font-size:12px;font-weight:600;margin-bottom:10px;color:var(--text);}
.room-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px;}
.room-pick-btn{padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;text-align:left;font-family:inherit;transition:all .12s;}
.room-pick-btn:hover{border-color:var(--teal);color:var(--teal);background:rgba(45,212,191,.08);}
.room-pick-btn.unavail{opacity:.35;cursor:not-allowed;text-decoration:line-through;}
.room-picker-skip{font-size:11px;color:var(--text3);cursor:pointer;text-align:center;padding:4px;border-radius:5px;}
.room-picker-skip:hover{color:var(--text2);background:var(--surface);}

/* ── CONFLICT ALERT ── */
.conflict-alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:6000;display:none;align-items:center;justify-content:center;}
.conflict-alert-overlay.open{display:flex;}
.conflict-alert{background:var(--bg2);border:1px solid rgba(245,101,101,.5);border-radius:12px;padding:20px 22px;max-width:420px;width:90%;}
.conflict-alert-icon{font-size:24px;margin-bottom:10px;}
.conflict-alert-title{font-size:14px;font-weight:700;color:var(--red2);margin-bottom:8px;}
.conflict-alert-body{font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:16px;}
.conflict-alert-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-keep{padding:5px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;}
.btn-undo{padding:5px 14px;border-radius:6px;border:1px solid var(--red);background:rgba(245,101,101,.12);color:var(--red2);font-size:12px;cursor:pointer;font-family:inherit;}

/* ── 115-2 新增 ── */
.course-item.noslot{opacity:.75;cursor:default;border-style:dashed;}
.tag-noslot{background:rgba(255,255,255,.08);color:var(--text2);}
.tag-joint{background:rgba(45,212,191,.15);color:var(--teal);}
.course-note{font-size:10px;color:var(--text3);margin-top:3px;margin-bottom:18px;line-height:1.35;}
.slot-block.empty.dragover-bad{border-color:var(--red)!important;background:rgba(245,101,101,.12)!important;}
.class-info{font-size:11px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin:0 0 10px var(--label-w);line-height:1.6;max-width:calc(var(--col-w)*6 + 10px);}
.class-info b{color:var(--gold);font-weight:500;}
.save-ind{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-right:10px;}
.save-ind a{color:var(--text3);text-decoration:underline;cursor:pointer;margin-left:6px;}
.save-ind a:hover{color:var(--red2);}
.form-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;}
/* 115-2 usability enhancements */
.course-tools{display:flex;gap:6px;padding:9px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.course-tools input,.course-tools select{min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:7px;padding:8px;font:inherit;font-size:12px}
.course-tools input{flex:1 1 140px}.course-tools select{flex:1 1 100px}
.course-tools input:focus,.course-tools select:focus{outline:2px solid var(--accent);outline-offset:1px}
.empty-course{padding:26px 8px;text-align:center;color:var(--text3);font-size:12px}
button:disabled{opacity:.35;cursor:not-allowed!important}
button:focus-visible,.course-item:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.course-item{padding-bottom:27px}.course-note{margin-bottom:3px}
@media(max-width:1100px){.sidebar{width:250px;min-width:250px}.teacher-panel{width:190px}.toolbar{gap:6px}}
@media(max-width:760px){body,.app{height:100dvh}.sidebar{width:205px;min-width:205px}.header{padding:9px}.toolbar{padding:7px}.teacher-panel{display:none}.bottom-panel{height:135px}.stats-panel{width:135px}.legend{overflow-x:auto;white-space:nowrap}.li{flex-shrink:0}}
@media print{body{background:#fff;color:#111;overflow:visible;height:auto}.sidebar,.toolbar,.bottom-panel,.teacher-panel,.legend,.save-ind{display:none!important}.app,.main,.content-row,.grid-area{height:auto;overflow:visible}.header{background:#fff;color:#111}.slot-block{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

/* Teal — custom palette */
:root{--hb-background:#FFFFFF;--hb-surface:#F2F3F3;--hb-text:#263238;--hb-primary:#00897B;--hb-accent:#E0F2F1;--hb-on-primary:#FFFFFF;
--bg:#FFFFFF;--bg2:#FFFFFF;--surface:#F2F3F3;--surface2:#E0F2F1;--border:#CFD8DC;--border2:#90A4AE;--text:#263238;--text2:#37474F;--text3:#546E7A;--accent:#00897B;--accent2:#00695C;--gold:#996D18;--green:#257A4B;--red:#B63D40;--red2:#A32D31;--purple:#7654A6;--teal:#00897B;--day-c:#5478B8;--eve-c:#B58929;--grad-c:#32865B;--prof-c:#8665B2}
body{background:var(--hb-background);color:var(--hb-text)}
.sidebar,.header,.toolbar,.legend,.teacher-panel,.bottom-panel,.teacher-selector,.room-selector{background:var(--hb-background)}
.course-item,.btn,.form-input,.form-select,.modal,.room-picker,.conflict-alert,.tooltip,.toast{background:var(--hb-surface);color:var(--hb-text)}
.btn.primary{background:var(--hb-primary);border-color:#00796B;color:var(--hb-on-primary)}
.btn.primary:hover{background:#00796B;color:#FFFFFF}
.class-tab.active,.vt-btn.active,.teacher-chip.active,.room-chip.active{background:var(--hb-primary)!important;color:var(--hb-on-primary)!important;border-color:#00796B!important}
.slot-block.empty,.noon-slot{background:#F7F9F9}
.cc-day{background:#DDE9FF;color:#294D80}.cc-eve{background:#FFF0C8;color:#77551B}.cc-grad{background:#D7F0DC;color:#245C3C}.cc-prof{background:#E9DDF9;color:#614282}.cc-custom{background:#E0F2F1;color:#263238}.cc-room{background:#D4F2E9;color:#176556}
.course-name,.header-title,.cc-name{color:var(--hb-text)}
.modal-overlay{background:rgba(38,50,56,.45)}
:focus-visible{outline:2px solid #00897B;outline-offset:2px}
/* Readability — 只調字體、對比與間距，不改版面 */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.header-sub,.save-ind,.tag-cred,.cc-credits,.teacher-load-txt,#sb-progress{font-family:'Noto Sans TC',sans-serif!important}
.header-sub{font-size:12px;color:var(--text2)}
.sb-title{font-size:11px;color:var(--text2)}
.course-name{font-weight:700;letter-spacing:.01em}
.tag{font-weight:600}.tag-req{background:#E3ECFA;color:#1E4F91}.tag-sel{background:#FDF0D5;color:#7A5410}.tag-cred{background:transparent;color:var(--text2)}
.class-tab{color:var(--text);border-color:var(--border2)}
.vt-btn{color:var(--text2);font-weight:500}
.li{color:var(--text2)}
.period-label .ptime{color:var(--text2)}
.slot-block{border-color:#D5DDE0}
.slot-block.empty,.noon-slot{background:#FFFFFF}
.slot-block.empty:hover,.slot-block.empty.dragover{background:#E0F2F1;border-color:var(--accent)}
.cc-name{font-weight:700}.cc-teacher{opacity:.95;font-size:11px}.cc-credits{opacity:.85}
.bottom-panel{height:125px}
.conflict-item{font-size:12px}.stat-row{font-size:12px}.sl{color:var(--text2)}
#export-word-wrap>.btn{background:#E0F2F1!important;border-color:#80CBC4!important;color:#00695C!important}
/* Course card — 突顯課程名稱與授課教師 */
.course-item{background:#FFFFFF;border:1px solid var(--border);border-left:4px solid #3F6FB5;border-radius:8px;padding:9px 10px 10px 12px!important;margin-bottom:7px;box-shadow:0 1px 2px rgba(38,50,56,.06)}
.course-item:has(.tag-sel){border-left-color:#C9962B}
.course-item.noslot{border-left-color:var(--border2)}
.course-item:hover{background:#FFFFFF;border-color:var(--border2);box-shadow:0 2px 6px rgba(38,50,56,.12)}
.course-name{font-size:14px;padding-right:78px;margin-bottom:6px}
.course-meta{gap:6px}
.course-teacher{flex-basis:100%;display:flex;align-items:center;margin-top:5px;font-size:13px;font-weight:600;color:var(--text)}
.course-teacher::before{content:'授課教師';flex-shrink:0;font-size:11px;font-weight:500;color:#00695C;background:#E0F2F1;border-radius:4px;padding:1px 6px;margin-right:7px}
.course-edit-btn,.course-del-btn{top:8px;bottom:auto;font-size:11px;background:#FFFFFF}
.placed-badge{right:86px;top:10px;font-size:11px;font-weight:700}
.course-note{margin-top:6px;margin-bottom:0;font-size:11px;color:var(--text2)}
.cc-teacher{font-size:11.5px;font-weight:600;opacity:1}
.slot-block.empty.off{background:repeating-linear-gradient(135deg,#F5F7F7 0 6px,#ECEFF0 6px 12px)!important;border-style:dashed;cursor:not-allowed}
.slot-block.empty.off:hover{border-color:#D5DDE0}
/* 清單拖曳排序 */
.course-item,.course-item.placed,.course-item.noslot{cursor:grab}
.course-item.placed{opacity:.5}
.course-item.drop-before{box-shadow:0 -3px 0 0 var(--accent)!important}
.course-item.drop-after{box-shadow:0 3px 0 0 var(--accent)!important}
/* 合班班級 */
.also-box{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--border);border-radius:8px;background:#FFFFFF}
.also-chip{display:inline-flex;align-items:center;padding:4px 11px;border:1px solid var(--border2);border-radius:14px;font-size:12px;cursor:pointer;background:#FFFFFF;color:var(--text);user-select:none}
.also-chip input{display:none}
.also-chip.on{background:#E0F2F1;border-color:var(--accent);color:#00695C;font-weight:600}
.also-chip.on::before{content:'✓ '}
/* 排課偏好 */
.pref-note{display:inline-block;margin-left:6px;font-size:11px;color:#00695C;cursor:help;white-space:nowrap}
.cc-shared{font-size:10px;font-weight:700;color:#00695C;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 課表往下捲時，星期列固定在上方 */
.tt-header-row{position:sticky;top:-13px;z-index:6;background:var(--bg);padding-top:6px;padding-bottom:6px;margin-bottom:0;box-shadow:0 1px 0 var(--border),0 4px 8px -6px rgba(38,50,56,.25)}
/* UX — 網頁內建確認視窗、工具列選單 */
.ui-dlg-ov{position:fixed;inset:0;z-index:10000;background:rgba(38,50,56,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ui-dlg{background:#FFFFFF;border-radius:12px;padding:22px 24px 18px;max-width:460px;width:100%;box-shadow:0 18px 50px rgba(38,50,56,.3)}
.ui-dlg-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.ui-dlg-msg{white-space:pre-line;font-size:14px;line-height:1.75;color:var(--text);margin-bottom:18px}
.ui-dlg-btns{display:flex;justify-content:flex-end;gap:8px}
.ui-dlg-btns .btn{padding:7px 16px;font-size:13px}
.ui-dlg-btns .btn.danger{background:#B63D40;border-color:#B63D40;color:#FFFFFF}
.tb-menu{position:relative;display:inline-block}
.tb-menu-list{display:none;position:absolute;top:calc(100% + 4px);left:0;background:#FFFFFF;border:1px solid var(--border2);border-radius:8px;padding:6px;z-index:2000;min-width:180px;box-shadow:0 8px 24px rgba(38,50,56,.15);flex-direction:column;gap:4px}
.tb-menu.open .tb-menu-list{display:flex}
.tb-menu-list .btn{width:100%;text-align:left;background:#FFFFFF}
.tb-menu-list .btn:hover{background:var(--surface2)}
.tb-menu-sep{height:1px;background:var(--border);margin:3px 2px}
#cloud-logout{margin-left:10px;padding:3px 10px;font-size:11px}
</style>

<style>
.sidebar{display:none!important;}
.toolbar > .btn, .toolbar > input, #cloud-status{display:none!important;}
.save-ind{display:none!important;}
.cc-remove{display:none!important;}
.slot-block{cursor:default!important;}
#pub-cover{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.pub-meta{font-size:11px;color:var(--text3);margin-right:12px;}
</style>
</head>
<body>
<div id="pub-cover">課表載入中…</div>
<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="app">
<!-- ══ SIDEBAR ══ -->
<div class="sidebar">
  <div class="sb-header">
    <span class="sb-title">待排課程</span>
    <span id="sb-progress" style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;"></span>
  </div>
  <div class="class-tabs" id="class-tabs"></div>
  <button class="add-course-btn" onclick="openAddModal()">＋ 新增課程</button>
  <div class="course-tools"><input id="course-search" type="search" placeholder="搜尋課程或教師…" aria-label="搜尋課程或教師" oninput="renderCourseList()"><select id="course-filter" aria-label="課程狀態" onchange="renderCourseList()"><option value="all">全部課程</option><option value="pending">僅待排</option><option value="placed">僅已排</option><option value="noslot">不排課表</option></select></div><div class="course-list" id="course-list"></div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">
  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-title">供應鏈管理系 公開課表</div>
      <div class="header-sub" id="header-sub"></div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:4px;"><select id="sem-select" title="切換學期" style="font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text);" onchange="location.search='?sem='+this.value"></select><button class="btn" id="zoom-btn" onclick="cycleZoom()" title="切換字級大小" style="padding:2px 8px;font-size:11px;">字級</button></div>
    </div>
    <div style="display:flex;align-items:center;">
      <span class="pub-meta" id="pub-meta"></span><span class="save-ind" id="save-ind">尚未儲存<a onclick="resetToDefault()" title="清除自動儲存，回到開課計畫的預設資料">重設</a></span>
      <div class="status-pill ok" id="status-pill">
        <span class="dot"></span><span id="status-txt">就緒</span>
      </div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="btn" onclick="cloudSignIn()" id="cloud-login">🔐 管理員登入</button>
    <button class="btn" onclick="cloudSignOut()" id="cloud-logout" style="display:none">登出</button>
    <button class="btn primary" onclick="cloudPublish()" id="cloud-publish" style="display:none">📢 發布公開課表</button>
    <span id="cloud-status" role="status" style="font-size:12px;color:var(--text2)">雲端尚未設定</span>
    <button class="btn" id="undo-btn" onclick="undoScheduleChange()" title="復原上一次資料變更" disabled>↶ 復原</button>
    <button class="btn primary" onclick="autoArrange()" title="依老師偏好與校定時段，自動排入所有未排課程">⚡ 一鍵排課</button>
    <button class="btn danger" onclick="clearAll()">✕ 清除全部</button>
    <button class="btn" onclick="openTeacherMgr()">👤 管理教師</button>
    <button class="btn" onclick="openClassMgr()">🏫 管理班級</button>
    <button class="btn" onclick="openRoomMgr()">🚪 管理教室</button>
    <button class="btn" onclick="exportBackup()">↓ 匯出備份</button>
    <button class="btn" onclick="document.getElementById('import-file').click()">↑ 匯入備份</button>
    <input type="file" id="import-file" accept=".json" onchange="importBackup(event)" style="display:none;">
    <button class="btn" onclick="document.getElementById('import-plan').click()" title="匯入系辦的開課計畫（Word .docx）或 Excel/CSV 開課表">📥 匯入開課表</button>
    <input type="file" id="import-plan" accept=".docx,.xlsx,.xls,.csv" onchange="importPlan(event)" style="display:none;">
    <button class="btn" onclick="document.getElementById('import-pref').click()" title="一次選多份老師回填的排課偏好調查 Word 檔">📋 匯入偏好調查</button>
    <input type="file" id="import-pref" accept=".docx" multiple onchange="importPrefs(event)" style="display:none;">
    <div style="position:relative;display:inline-block;" id="export-word-wrap">
      <button class="btn" onclick="toggleExportMenu()" style="background:rgba(62,207,142,.12);border-color:rgba(62,207,142,.4);color:#3ecf8e;">📄 匯出 Word</button>
      <div id="export-menu" style="display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:6px;z-index:2000;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);">
        <div onclick="exportWord('class')"  style="padding:7px 12px;font-size:12px;cursor:pointer;border-radius:5px;color:var(--text2);transition:background .1s;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">🏫 班級課表</div>
        <div onclick="exportWord('teacher')" style="padding:7px 12px;font-size:12px;cursor:pointer;border-radius:5px;color:var(--text2);transition:background .1s;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">👤 教師課表</div>
        <div onclick="exportWord('room')"    style="padding:7px 12px;font-size:12px;cursor:pointer;border-radius:5px;color:var(--text2);transition:background .1s;" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">🚪 教室課表</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="view-toggle">
      <button class="vt-btn active" id="vt-class"   onclick="setView('class')">班級課表</button>
      <button class="vt-btn"        id="vt-teacher" onclick="setView('teacher')">教師課表</button>
      <button class="vt-btn"        id="vt-room"    onclick="setView('room')">教室課表</button>
      <button class="vt-btn"        id="vt-load"    onclick="setView('load')">教師負載</button>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <span class="li"><span class="ld" style="background:var(--day-c)"></span>日間四技</span>
    <span class="li"><span class="ld" style="background:var(--eve-c)"></span>進修四技</span>
    <span class="li"><span class="ld" style="background:var(--grad-c)"></span>碩士班</span>
    <span class="li"><span class="ld" style="background:var(--prof-c)"></span>碩士在職班</span>
    <span class="li"><span class="ld" style="background:rgba(245,101,101,.6)"></span>衝堂</span>
    <span class="li"><span class="ld" style="background:rgba(255,255,255,.2)"></span>共同/自訂</span>
    <span style="flex:1"></span>
    <span style="font-size:10px;color:var(--text3);font-style:italic;">拖曳排課 · 學分=節數</span>
  </div>

  <!-- Content -->
  <div class="content-row" id="content-row">
    <!-- Class view -->
    <div id="view-class" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
      <div class="grid-area" id="grid-area"></div>
    </div>

    <!-- Teacher view -->
    <div id="view-teacher" style="flex:1;overflow:hidden;display:flex;flex-direction:column;display:none;">
      <div class="teacher-selector" id="teacher-selector"></div>
      <div class="teacher-grid-area" id="teacher-grid-area"></div>
    </div>

    <!-- Room view -->
    <div id="view-room" style="flex:1;overflow:hidden;display:none;flex-direction:column;">
      <div class="room-selector" id="room-selector"></div>
      <div class="teacher-grid-area" id="room-grid-area"></div>
    </div>

    <!-- Load view: teacher panel only -->
    <div id="view-load" style="flex:1;overflow:hidden;display:flex;display:none;">
      <div style="flex:1;overflow-y:auto;padding:14px 20px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;">全系教師授課負載</div>
        <div id="load-list" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-panel">
    <div class="conflict-panel">
      <div class="conflict-title">衝堂偵測 <span id="conflict-count" style="color:var(--red2);"></span></div>
      <div id="conflict-list"></div>
    </div>
    <div class="stats-panel">
      <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">排課進度</div>
      <div class="stat-row"><span class="sl">已排課程</span><span class="sv" style="color:var(--green)" id="s-placed">0</span></div>
      <div class="stat-row"><span class="sl">待排課程</span><span class="sv" style="color:var(--gold)" id="s-remain">0</span></div>
      <div class="stat-row"><span class="sl">衝堂數</span><span class="sv" style="color:var(--red2)" id="s-conf">0</span></div>
      <div class="stat-row"><span class="sl">完成率</span><span class="sv" style="color:var(--accent2)" id="s-pct">0%</span></div>
    </div>
  </div>
</div>
</div>

<!-- ══ ADD COURSE MODAL ══ -->
<div class="modal-overlay" id="add-modal" style="display:none" onclick="closeModalOutside(event)">
  <div class="modal" style="width:440px;position:relative;overflow:visible;">
    <div class="modal-title" id="modal-course-title">新增課程</div>
    <div class="form-row">
      <label class="form-label">班級</label>
      <!-- 新增模式：鎖定顯示，不可更改 -->
      <div id="m-class-locked" style="padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px;"></div>
      <!-- 編輯模式：可切換 -->
      <select class="form-select" id="m-class" style="display:none;"></select>
    </div>
    <div class="form-row">
      <label class="form-label">課程名稱</label>
      <input class="form-input" id="m-name" placeholder="例：實用英文(一)、體育(一)..." />
    </div>
    <div class="form-row-2">
      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">學分（節數）</label>
        <select class="form-select" id="m-credits">
          <option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="6">6</option><option value="9">9</option>
        </select>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <label class="form-label">必/選修</label>
        <select class="form-select" id="m-type">
          <option>必修</option><option>選修</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:12px;position:relative;">
      <label class="form-label">任課教師（可搜尋選擇，支援多位）</label>
      <div class="teacher-tag-input-wrap" id="m-teacher-wrap" onclick="document.getElementById('m-teacher-search').focus()">
        <input class="teacher-search-input" id="m-teacher-search"
          placeholder="搜尋教師姓名…"
          autocomplete="off"
          oninput="onTeacherSearch(this.value)"
          onkeydown="onTeacherSearchKey(event)"
          onfocus="showTeacherDropdown()"
        />
      </div>
      <div class="teacher-dropdown" id="m-teacher-dropdown"></div>
    </div>
    <div class="form-row-2">
      <div class="form-row" style="margin-bottom:0;grid-column:1/-1">
        <label class="form-label">合班班級（選填，勾選後排課時會同時出現在這些班級的課表）</label>

const comap = () => {
  const m={};
  // 先走一遍，第一個遇到的 ID 優先（防止重複 ID 時後面覆蓋前面）
  for(const c of COURSES){ if(!m[c.id]) m[c.id]=c; }

}

// 網頁內建確認／提示視窗（取代瀏覽器原生 confirm / alert）
function uiDialog(msg,{ok='確定',cancel='取消',danger=false,title=''}={}){
  return new Promise(resolve=>{
    const ov=document.createElement('div'); ov.className='ui-dlg-ov';
    ov.innerHTML=`<div class="ui-dlg" role="dialog" aria-modal="true">${title?'<div class="ui-dlg-title"></div>':''}<div class="ui-dlg-msg"></div><div class="ui-dlg-btns">${cancel!==null?'<button class="btn ui-dlg-cancel"></button>':''}<button class="btn ${danger?'danger':'primary'} ui-dlg-ok"></button></div></div>`;
    if(title) ov.querySelector('.ui-dlg-title').textContent=title;
    ov.querySelector('.ui-dlg-msg').textContent=String(msg);
    ov.querySelector('.ui-dlg-ok').textContent=ok;
    const cb=ov.querySelector('.ui-dlg-cancel'); if(cb) cb.textContent=cancel;
    const done=v=>{ document.removeEventListener('keydown',key,true); ov.remove(); resolve(v); };
    const key=e=>{ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(false); } else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); done(true); } };
    ov.querySelector('.ui-dlg-ok').onclick=()=>done(true);
    if(cb) cb.onclick=()=>done(false);
    ov.addEventListener('mousedown',e=>{ if(e.target===ov && cancel!==null) done(false); });
    document.addEventListener('keydown',key,true);
    document.body.appendChild(ov);
    (cb||ov.querySelector('.ui-dlg-ok')).focus();
  });
}
function uiConfirm(msg,opt={}){ return uiDialog(msg,{danger:/清除|刪除|覆蓋|取代|重設/.test(msg),...opt}); }
function uiAlert(msg){ return uiDialog(msg,{cancel:null}); }
function xe(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 需要排入課表的課程（排除實習、論文等 noSlot）
function slotCourses(){ return COURSES.filter(c=>!c.noSlot); }
// 兩門課是否為合班（同代碼、不同課程）
function isJointPair(a,b){ return !!(a&&b&&a.joint&&a.joint===b.joint&&a.id!==b.id); }
// 該課程的老師在 day/span 是否已有其他課（合班不算）；回傳第一筆衝突課程或 null
function teacherBusy(courseId, day, span){
  const cm=comap(); const co=cm[courseId]; if(!co||!co.teachers.length) return null;
  for(const cls of CLASSES) for(const e of (schedule[cls.id]||[])){
    if(e.day!==day||e.courseId===courseId) continue;
    const oco=cm[e.courseId]; if(!oco||isJointPair(co,oco)) continue;
    if(!oco.teachers.some(t=>co.teachers.includes(t))) continue;
    if(e.slots.some(s=>span.includes(s))) return oco;
  }
  return null;
}

// ── Period helpers ──
function getPeriodsConfig(cls){
  if(cls.type==='day')  return DAY_PERIODS;
  if(cls.type==='eve')  return DAY_PERIODS;   // 顯示 1–D 節；平日 1–9 節會標示為不可排
  if(cls.type==='grad') return DAY_PERIODS;   // 碩一：第1-9節（含午休分隔），週一–週五
  return GRAD_PERIODS;                        // 碩專一：第1-13節，週一–週六
}
function getRealPeriods(cls){
  if(cls.type==='day')  return DAY_REAL;
  if(cls.type==='eve')  return EVE_REAL;
  if(cls.type==='grad') return DAY_REAL;      // 碩一：1-9
  return GRAD_REAL;                           // 碩專一：1-13
}

function getSpan(cls, startP, n, day){
  // 進修部週六：第1–D節（午休前後不可跨），平日維持 A–D 節
  if(cls.type==='eve' && day===6){
    const grp=DAY_MORNING.includes(startP)?DAY_MORNING:DAY_AFTERNOON;
    const i=grp.indexOf(startP);
    if(i<0||i+n>grp.length) return null;
    return grp.slice(i,i+n);
  }
  if(cls.type==='day'||cls.type==='grad'){
    // 日間部、碩一：第1-9節，跨午休限制
    const inM = DAY_MORNING.includes(startP);
    const grp = inM ? DAY_MORNING : DAY_AFTERNOON;
    const i = grp.indexOf(startP);
    if(i<0) return null;
    if(i+n>grp.length) return null;
    return grp.slice(i,i+n);
  }
  if(cls.type==='prof'){
    // 碩專一：第1-13節，跨午休限制
    const inM = GRAD_MORNING.includes(startP);
    const grp = inM ? GRAD_MORNING : GRAD_AFTERNOON;
    const i = grp.indexOf(startP);
    if(i<0) return null;
    if(i+n>grp.length) return null;
    return grp.slice(i,i+n);
  }
  // 進修部 Eve：A-D 連續，無午休限制
  const real = getRealPeriods(cls);
  const i = real.indexOf(startP);
  if(i<0||i+n>real.length) return null;
  return real.slice(i,i+n);
}

// Same span logic for teacher view (uses teacher periods)
function getTeacherSpan(startP, n){
  // Teacher periods don't have noon block division for scheduling span
  const i = TEACHER_REAL.indexOf(startP);
  if(i<0) return null;
  // Prevent crossing noon: 1-4 group and 5-D group
  const morningT=[1,2,3,4], pmT=[5,6,7,8,9,'A','B','C','D'];
  const inM=morningT.includes(startP);
  const grp=inM?morningT:pmT;
  const gi=grp.indexOf(startP);
  if(gi+n>grp.length) return null;
  return grp.slice(gi,gi+n);
}

// ── Schedule queries ──
function isPlaced(courseId){
  for(const cls of CLASSES){
    if(schedule[cls.id]?.some(e=>e.courseId===courseId)) return true;
  }
  return false;
}
function getEntry(courseId){
  for(const cls of CLASSES){
    const e=schedule[cls.id]?.find(e=>e.courseId===courseId);
    if(e) return {...e, classId:cls.id};
  }
  return null;
}
// 合班：課程可設定 also=[其他班級ID]，排課時同時佔用並顯示在這些班級的課表
function entriesForClass(cid){
  const out=[...(schedule[cid]||[])]; const cm=comap();
  for(const cls of CLASSES){ if(cls.id===cid) continue;
    for(const e of (schedule[cls.id]||[])){ const co=cm[e.courseId]; if(co?.also?.includes(cid)) out.push({...e,classId:cls.id,shared:true}); } }
  return out;
}
function isSpanFree(classId,day,span,ignoreCourseId){
  for(const e of entriesForClass(classId)){
    if(e.day!==day||e.courseId===ignoreCourseId) continue;
    for(const s of span) if(e.slots.includes(s)) return false;
  }
  return true;
}
// 檢查本班＋所有合班班級在該時段能否排；可以回傳空字串，否則回傳原因
function spanProblem(co,day,span){
  for(const cid of [co.classId,...(co.also||[])]){
    const c=cmap[cid]; if(!c) continue; const own=cid===co.classId;
    if(!getClassDays(c).includes(day)) return `⚠ ${own?'此班級':'合班班級「'+c.name+'」'}${DAY_LABELS[day]}不排課`;
    const sp=getSpan(c,span[0],span.length,day);
    if(!sp||sp.join()!==span.join()) return `⚠ ${own?'此格':'合班班級「'+c.name+'」在這個時段'}無法排課`;
    if(!isSpanFree(cid,day,span,co.id)) return own?'⚠ 該時段已有課程':`⚠ 合班班級「${c.name}」該時段已有課程`;
  }
  return '';
}
function renderAlsoBox(ownId,selected){
  const box=document.getElementById('m-also'); if(!box) return;
  box.innerHTML=CLASSES.filter(c=>c.id!==ownId).map(c=>`<label class="also-chip${selected.includes(c.id)?' on':''}"><input type="checkbox" value="${c.id}" ${selected.includes(c.id)?'checked':''}>${xe(c.name)}</label>`).join('');
  box.querySelectorAll('input').forEach(i=>i.onchange=()=>i.parentElement.classList.toggle('on',i.checked));
  const sel=document.getElementById('m-class'); if(sel) sel.onchange=()=>renderAlsoBox(sel.value,[...box.querySelectorAll('input:checked')].map(i=>i.value));
}

      for(const s of slots) if(e.slots.includes(s)) return e;

}

let pendingPlace=null;

function placeCourse(courseId, classId, day, startP){
  const cm=comap(); const co=cm[courseId];
  if(!co||co.classId!==classId){ showToast('⚠ 課程班級不符'); return false; }
  if(co.noSlot){ showToast('⚠ 此課程設定為不排入課表'); return false; }
  if(isPlaced(courseId)){ showToast('⚠ 課程已排入'); return false; }
  const cls=cmap[classId];
  if(!getClassDays(cls).includes(day)){ showToast('⚠ 此班級該天不排課'); return false; }
  const span=getSpan(cls,startP,co.credits,day);
  if(!span){ showToast(`⚠ 此格無法容納 ${co.credits} 節連排（超出範圍或跨越午休）`); return false; }
  { const p=spanProblem(co,day,span); if(p){ showToast(p); return false; } }
  // Store pending and open room picker
  pendingPlace={courseId,classId,day,slots:span};
  openRoomPicker(day,span);
  return true;
}

function finalizePlacement(roomId){
  if(!pendingPlace) return;
  const {courseId,classId,day,slots}=pendingPlace;
  pendingPlace=null;
  const entry={courseId,day,slots,roomId:roomId||null};
  schedule[classId].push(entry);
  lastPlaced={classId,entry};
  render();
  const newConflicts=detectConflicts();
  const fresh=newConflicts.filter(c=>c.affected.some(a=>a.courseId===courseId));
  if(fresh.length>0){
    const lines=fresh.map(c=>`• ${c.msg}`).join('\n');
    const hasRoom=fresh.some(c=>c.type==='room');
    const hasTch=fresh.some(c=>c.type==='teacher');
    const title=hasRoom&&hasTch?'教師 & 教室衝堂警告':hasRoom?'教室衝堂警告':'教師衝堂警告';
    showConflictAlert(title,lines);
  }
}

function undoLastPlace(){
  if(!lastPlaced) return;
  const {classId,entry}=lastPlaced;
  schedule[classId]=schedule[classId].filter(e=>e!==entry);
  lastPlaced=null;
  closeConflictAlert();
  render(); detectConflicts();
  showToast('已取消排課');
}

function removeCourse(courseId){
  // 清除所有 schedule 裡對應的 entry（不依賴 co.classId，直接全班掃）
  for(const cls of CLASSES){
    if(schedule[cls.id]){
      schedule[cls.id]=schedule[cls.id].filter(e=>e.courseId!==courseId);
    }
  }
}

// 課表格子上的 × 按鈕：清 schedule，課程保留在側欄可再排
function removeEntry(courseId){
  removeCourse(courseId);
  render(); detectConflicts();
  showToast('已從課表移除，課程仍可重新排入');
}

// 教師課表拖曳移動：把課程換到新的時段（保留原班級）
function moveEntry(courseId, newDay, newStartP){
  const cm=comap();
  const co=cm[courseId]; if(!co) return;
  const classId=co.classId;
  const cls=cmap[classId]; if(!cls) return;

  // 班級上課日檢查（例：日間部不可移到週六）
  if(!getClassDays(cls).includes(newDay)){
    showToast(`⚠ ${cls.name} 不在${DAY_LABELS[newDay]}排課`);
    return;
  }

  // 計算新 span
  const newSpan=getSpan(cls, newStartP, co.credits, newDay);
  if(!newSpan){
    showToast(`⚠ 此格無法容納 ${co.credits} 節連排（跨午休或超出範圍）`);
    return;
  }

  // 先暫時移除原排課
  const oldEntry=schedule[classId]?.find(e=>e.courseId===courseId);
  const oldRoomId=oldEntry?.roomId||null;
  removeCourse(courseId);

  // 檢查新時段是否空閒（同班）
  if(spanProblem(co, newDay, newSpan)){
    // 放回原位
    if(oldEntry) schedule[classId].push(oldEntry);
    render(); detectConflicts();
    showToast('⚠ 新時段已有其他課程，無法移動');
    return;
  }

  // 放入新時段
  const newEntry={courseId, day:newDay, slots:newSpan, roomId:oldRoomId};
  schedule[classId].push(newEntry);
  lastPlaced={classId, entry:newEntry};

  render();
  const newConflicts=detectConflicts();
  const fresh=newConflicts.filter(c=>c.affected.some(a=>a.courseId===courseId));
  if(fresh.length>0){
    const lines=fresh.map(c=>`• ${c.msg}`).join('\n');
    const hasRoom=fresh.some(c=>c.type==='room');
    const hasTch=fresh.some(c=>c.type==='teacher');
    const title=hasRoom&&hasTch?'教師 & 教室衝堂警告':hasRoom?'教室衝堂警告':'教師衝堂警告';
    showConflictAlert(title,lines);
  } else {
    showToast('✓ 課程已移動，無衝堂');
  }
}

function openRoomPicker(day,slots){
  const picker=document.getElementById('room-picker');
  const grid=document.getElementById('room-picker-grid');
  grid.innerHTML='';
  for(const room of ROOMS){
    const busy=isRoomBusy(room.id,day,slots);
    const btn=document.createElement('button');
    btn.className='room-pick-btn'+(busy?' unavail':'');
    btn.innerHTML=`<strong>${room.name}</strong>${busy?`<br><span style="font-size:9px;color:var(--red2)">已被佔用</span>`:''}`;
    if(!busy) btn.onclick=()=>{ closeRoomPickerUI(); finalizePlacement(room.id); };
    grid.appendChild(btn);
  }
  picker.style.cssText='top:50%;left:50%;transform:translate(-50%,-50%);';
  picker.classList.add('open');
  setTimeout(()=>document.addEventListener('click',outsideRoomPickerClose,{once:true,capture:true}),120);
}
function outsideRoomPickerClose(e){
  if(!document.getElementById('room-picker').contains(e.target)) skipRoomPick();
}
function skipRoomPick(){ closeRoomPickerUI(); finalizePlacement(null); }
function closeRoomPickerUI(){
  document.getElementById('room-picker').classList.remove('open');
  document.removeEventListener('click',outsideRoomPickerClose,true);
}

// ══════════════════════════════════════════
//  CONFLICT DETECTION (teacher + room)
// ══════════════════════════════════════════
function detectConflicts(){
  conflicts=[];
  const cm=comap();
  // 收集 (key → 時段清單)，再兩兩比對；合班（同 joint 代碼）不算衝堂
  const check=(type,bucket,label)=>{
    for(const [key,slots] of Object.entries(bucket)){
      const byK={};
      for(const s of slots){ const k=`${s.day}_${s.period}`; (byK[k]=byK[k]||[]).push(s); }
      for(const list of Object.values(byK)){
        for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
          const s=list[i], t=list[j];
          if(s.courseId===t.courseId) continue;
          const a=cm[s.courseId], b=cm[t.courseId];
          if(isJointPair(a,b)) continue;
          const msg=`${label(key)}：${cmap[s.classId]?.name}「${a?.name}」 vs ${cmap[t.classId]?.name}「${b?.name}」${DAY_LABELS[s.day]||'週'+s.day} 第${s.period}節`;
          if(conflicts.find(c=>c.msg===msg)) continue;
          const c={type,msg,affected:[{classId:s.classId,courseId:s.courseId},{classId:t.classId,courseId:t.courseId}]};
          if(type==='teacher') c.tid=key; else c.rid=key;
          conflicts.push(c);
        }
      }
    }
  };
  const tslots={}, rslots={};
  for(const cls of CLASSES){
    for(const e of (schedule[cls.id]||[])){
      const co=cm[e.courseId]; if(!co) continue;
      for(const tid of co.teachers){
        (tslots[tid]=tslots[tid]||[]);
        for(const p of e.slots) tslots[tid].push({classId:cls.id,day:e.day,period:p,courseId:e.courseId});
      }
      if(e.roomId){
        (rslots[e.roomId]=rslots[e.roomId]||[]);
        for(const p of e.slots) rslots[e.roomId].push({classId:cls.id,day:e.day,period:p,courseId:e.courseId});
      }
    }
  }
  check('teacher',tslots,tid=>`教師 ${getTName(tid)}`);
  check('room',rslots,rid=>`教室 ${ROOMS.find(r=>r.id===rid)?.name||rid}`);
  updateConflictUI(); return conflicts;
}

function getConflictCourseKeys(){
  const s=new Set();
  for(const c of conflicts) for(const a of c.affected) s.add(`${a.classId}__${a.courseId}`);
  return s;
}

//  RENDER HELPERS
// ══════════════════════════════════════════
const ROW_H=44, GAP=2, NOON_H=9;

function buildTimetable(periods, days, dayLabels, classId_or_null, teacherId_or_null){
  // Returns a DOM fragment
  // classId_or_null: if set, renders class schedule
  // teacherId_or_null: if set, renders teacher schedule (read-only, no drag)
  const cm=comap();
  const conflictKeys=getConflictCourseKeys();
  const isTeacherView=!!teacherId_or_null;
  const wrap=document.createElement('div');
  wrap.className='timetable-wrap';

  // Header
  const hdr=document.createElement('div');
  hdr.className='tt-header-row'+(isTeacherView?' tt-teacher':'');
  for(const d of days){
    const dh=document.createElement('div');
    dh.className='tt-day-hdr';
    dh.textContent=dayLabels[d]||`週${d}`;
    if(d===6) dh.style.cssText='color:var(--purple);font-weight:700;';
    hdr.appendChild(dh);
  }
  wrap.appendChild(hdr);

  // Build lookup: {day:{periodId: entry}}
  let slotMap={};
  if(classId_or_null){
    for(const e of entriesForClass(classId_or_null)){
      if(!slotMap[e.day]) slotMap[e.day]={};
      for(const p of e.slots) slotMap[e.day][p]=e;
    }
  } else if(teacherId_or_null){
    // Collect all entries where this teacher appears
    for(const cls of CLASSES){
      for(const e of schedule[cls.id]){
        const co=cm[e.courseId]; if(!co) continue;
        if(!co.teachers.includes(teacherId_or_null)) continue;
        if(!slotMap[e.day]) slotMap[e.day]={};
        for(const p of e.slots){
          slotMap[e.day][p]={...e, classId:cls.id};
        }
      }
    }
  }

  const rendered=new Set();
  // day/grad 和 prof 的 PERIODS 都沒有 noon 列，需手動插入視覺午休分隔
  const isGradClass = classId_or_null && ['day','grad','prof','eve'].includes(cmap[classId_or_null]?.type);

  for(const period of periods){
    // Insert noon gap row before period 5 for grad/prof (no noon period in GRAD_PERIODS)
    if(isGradClass && period.id===5){
      const noonRow=document.createElement('div');
      noonRow.className='tt-period-row noon-row';
      const npl=document.createElement('div'); npl.className='period-label';
      npl.innerHTML=`<span style="font-size:9px;color:var(--text3)">午休</span>`;
      noonRow.appendChild(npl);
      for(const d of days){
        const nc=document.createElement('div'); nc.className='day-cell'; nc.style.height=`${NOON_H}px`;
        const ns=document.createElement('div'); ns.className='noon-slot';
        nc.appendChild(ns); noonRow.appendChild(nc);
      }
      wrap.appendChild(noonRow);
    }

    const isNoon=period.id==='noon';
    const row=document.createElement('div');
    row.className='tt-period-row'+(isNoon?' noon-row':'');

    const pl=document.createElement('div');
    pl.className='period-label';
    if(isNoon) pl.innerHTML=`<span style="font-size:9px;color:var(--text3)">午休</span>`;
    else pl.innerHTML=`<span class="pnum">${period.label}</span><span class="ptime">${period.time}</span>`;
    row.appendChild(pl);

    for(const day of days){
      const cell=document.createElement('div');
      cell.className='day-cell';
      cell.style.height=isNoon?`${NOON_H}px`:`${ROW_H}px`;

      if(isNoon){
        const ns=document.createElement('div'); ns.className='noon-slot';
        cell.appendChild(ns); row.appendChild(cell); continue;
      }

      const entry=slotMap[day]?.[period.id];
      const rKey=entry?`${day}_${entry.courseId}`:null;

      if(entry&&!rendered.has(rKey)){
        rendered.add(rKey);
        const co=cm[entry.courseId];
        const isConflict=conflictKeys.has(`${entry.classId||classId_or_null}__${entry.courseId}`);
        const n=entry.slots.length;

        // Span height
        let spanH=n*ROW_H+(n-1)*GAP;
        // day/grad/prof 格局都沒有 noon row，跨越午休（第4→第5節）需加高
        const clsTypForNoon=classId_or_null?cmap[classId_or_null]?.type:null;
        if(clsTypForNoon&&clsTypForNoon!=='eve'){
          const crossNoon=entry.slots.some(s=>DAY_MORNING.includes(s))&&
                          entry.slots.some(s=>DAY_AFTERNOON.includes(s));
          if(crossNoon) spanH+=NOON_H+GAP;
        }
        // Teacher view noon crossing
        if(isTeacherView){
          const morningT=[1,2,3,4];
          const crossNoon=entry.slots.some(s=>morningT.includes(s))&&
                          entry.slots.some(s=>!morningT.includes(s));
          if(crossNoon) spanH+=NOON_H+GAP;
        }

        const block=document.createElement('div');
        block.className='slot-block'+(isConflict?' conflict':'');
        block.style.height=`${spanH}px`;

        const clsType=(entry.classId?cmap[entry.classId]?.type:null)||(classId_or_null?cmap[classId_or_null]?.type:null)||'day';
        const card=document.createElement('div');
        card.className=`course-card ${co?.custom?'cc-custom':getClassCc(clsType)}`;
        const teachers=(co?.teachers||[]).slice(0,2).map(getTName).join('/');
        const subtitle=isTeacherView?(cmap[entry.classId]?.name||''):(teachers);
        const rm=entry.roomId?ROOMS.find(r=>r.id===entry.roomId):null;
        card.innerHTML=`
          <div class="cc-name">${co?.name||''}</div>
          <div class="cc-teacher">${subtitle}</div>
          ${(()=>{ if(isTeacherView||!co) return ''; const ids=[co.classId,...(co.also||[])].filter(x=>x&&x!==classId_or_null); return ids.length?`<div class="cc-shared">合班・${ids.map(x=>xe(cmap[x]?.name||x)).join('、')}</div>`:''; })()}
          <div class="cc-credits">${co?.credits}節${co?.type?'·'+co.type:''}</div>
          ${rm?`<div class="room-badge">🚪${rm.name}</div>`:''}
          <div class="cc-remove" onclick="removeEntry('${entry.courseId}')">×</div>
        `;
        // 教師課表也可拖曳移動
        if(isTeacherView){
          block.draggable=true;
          block.style.cursor='grab';
          block.addEventListener('dragstart',ev=>{
            movingCourseId=entry.courseId;
            movingFromEntry={...entry};
            ev.dataTransfer.effectAllowed='move';
            setTimeout(()=>block.style.opacity='.4',0);
          });
          block.addEventListener('dragend',()=>{
            block.style.opacity='';
            if(!movingCourseId) movingCourseId=null;
          });
        }
        block.addEventListener('mouseenter',e=>showTooltip(e,co,entry,isTeacherView));
        block.addEventListener('mouseleave',hideTooltip);
        block.appendChild(card);
        cell.appendChild(block);
      } else if(!entry){
        if(!isTeacherView && cmap[classId_or_null]?.type==='eve' && day!==6 && !EVE_REAL.includes(period.id)){
          // 進修部平日只排 A–D 節
          const off=document.createElement('div');
          off.className='slot-block empty off'; off.style.height=`${ROW_H}px`; off.title='進修部平日只排 A–D 節';
          cell.appendChild(off); row.appendChild(cell); continue;
        }
        if(!isTeacherView){
          // 班級課表：一般拖放排課
          const block=document.createElement('div');
          block.className='slot-block empty';
          block.style.height=`${ROW_H}px`;
          if(day===6) block.style.background='rgba(167,139,250,.06)';
          block.dataset.day=day; block.dataset.period=period.id;
          block.addEventListener('dragover',e=>{
            e.preventDefault();
            if(dragCourseId){
              const co=cm[dragCourseId];
              const cls=cmap[classId_or_null];
              const span=getSpan(cls,period.id,co?.credits||1,day);
              // 預覽：老師該時段已有課 → 紅色
              if(span){
                const bad=teacherBusy(dragCourseId,day,span);
                block.classList.add(bad?'dragover-bad':'dragover');
                if(bad) block.title=`老師此時段已有：${bad.name}（${cmap[bad.classId]?.name||''}）`;
              }
            }
          });
          block.addEventListener('dragleave',()=>{ block.classList.remove('dragover','dragover-bad'); block.title=''; });
          block.addEventListener('drop',e=>{
            e.preventDefault(); block.classList.remove('dragover','dragover-bad'); block.title='';
            if(dragCourseId){
              const ok=placeCourse(dragCourseId,classId_or_null,day,period.id);
              if(ok) showToast(conflicts.length===0?'✓ 排課成功，無衝堂':`⚠ 已排入，但有 ${conflicts.length} 筆衝堂`);
            }
          });
          cell.appendChild(block);
        } else {
          // 教師課表：空格可接受移動 drop
          const block=document.createElement('div');
          block.className='slot-block empty';
          block.style.height=`${ROW_H}px`;
          if(day===6) block.style.background='rgba(167,139,250,.06)';
          block.addEventListener('dragover',e=>{
            if(movingCourseId){ e.preventDefault(); block.classList.add('dragover'); }
          });
          block.addEventListener('dragleave',()=>block.classList.remove('dragover'));
          block.addEventListener('drop',e=>{
            e.preventDefault(); block.classList.remove('dragover');
            if(movingCourseId){
              moveEntry(movingCourseId, day, period.id);
              movingCourseId=null; movingFromEntry=null;
            }
          });
          cell.appendChild(block);
        }
      }
      row.appendChild(cell);
    }
    wrap.appendChild(row);
  }
  return wrap;
}

function renderClassTabs(){
  const el=document.getElementById('class-tabs'); el.innerHTML='';
  for(const cls of CLASSES){
    const btn=document.createElement('button');
    btn.className=`class-tab${cls.id===selectedClassId?' active':''}`;
    btn.dataset.type=cls.type; btn.textContent=cls.name;
    btn.onclick=()=>{ selectedClassId=cls.id; render(); };
    el.appendChild(btn);
  }
}

function courseGroup(c){ return c.noSlot?2:(isPlaced(c.id)?1:0); }
function sortCourseList(list){
  const idx=new Map(COURSES.map((c,i)=>[c.id,i]));
  const ord=c=>Number.isFinite(c.order)?c.order:idx.get(c.id)*10;
  return list.sort((a,b)=>courseGroup(a)-courseGroup(b)||ord(a)-ord(b));
}
function reorderCourse(srcId,targetId,after){
  const list=sortCourseList(COURSES.filter(c=>c.classId===selectedClassId));
  const src=list.find(c=>c.id===srcId); if(!src) return;
  const rest=list.filter(c=>c.id!==srcId);
  let i=rest.findIndex(c=>c.id===targetId); if(i<0) return;
  rest.splice(after?i+1:i,0,src);
  rest.forEach((c,k)=>{ c.order=(k+1)*10; });
  render(); showToast('✓ 已調整課程順序');
}
function renderCourseList(){
  const el=document.getElementById('course-list'); el.innerHTML='';
  const courses=COURSES.filter(c=>c.classId===selectedClassId);
  // 需排課的在前，不排入課表的放最後
  // 排序：待排 → 已排 → 不排課表；同一組內依自訂順序
  sortCourseList(courses);
  const keyword=(document.getElementById('course-search')?.value||'').trim().toLowerCase();
  const filter=document.getElementById('course-filter')?.value||'all';
  let visible=0;
  for(const co of courses){
    const placed=isPlaced(co.id);
    const matches=(!keyword||`${co.name} ${co.teachers.map(getTName).join(' ')} ${co.note||''}`.toLowerCase().includes(keyword)) && (filter==='all'||(filter==='pending'&&!placed&&!co.noSlot)||(filter==='placed'&&placed)||(filter==='noslot'&&co.noSlot));
    if(!matches) continue;
    visible++;
    const div=document.createElement('div');
    div.className=`course-item${co.noSlot?' noslot':(placed?' placed':'')}`;
    div.draggable=true; div.dataset.courseId=co.id;
    const teachers=co.teachers.map(getTName).join('、')||'未指定';
    div.innerHTML=`
      <div class="course-name">${xe(co.name)}${co.custom?'<span style="font-size:9px;color:var(--text3);margin-left:4px;">自訂</span>':''}</div>
      <div class="course-meta">
        <span class="tag ${co.type==='必修'?'tag-req':'tag-sel'}">${co.type}</span>
        <span class="tag tag-cred">${co.credits}${co.noSlot?'學分':'節'}</span>
        ${co.noSlot?'<span class="tag tag-noslot">不排課表</span>':''}
        ${co.joint?`<span class="tag tag-joint" title="合班代碼">合班 ${xe(co.joint)}</span>`:''}
        ${co.also?.length?`<span class="tag tag-joint" title="合班班級">合班 ${co.also.map(id=>xe(cmap[id]?.name||id)).join('、')}</span>`:''}
        <span class="course-teacher">${xe(teachers)}</span>
      </div>
      ${co.note?`<div class="course-note">${xe(co.note)}</div>`:''}
      ${placed?'<span class="placed-badge">✓</span>':''}
    `;
    // 拖曳：待排課程可拖進課表；所有課程都可在清單內上下拖曳調整順序（同一組內）
    div.addEventListener('dragstart',e=>{ listDragId=co.id; if(!placed&&!co.noSlot) dragCourseId=co.id; div.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',co.id); });
    div.addEventListener('dragend',()=>{ dragCourseId=null; listDragId=null; div.classList.remove('dragging'); document.querySelectorAll('.course-item.drop-before,.course-item.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after')); document.querySelectorAll('.slot-block.dragover,.slot-block.dragover-bad').forEach(s=>{ s.classList.remove('dragover','dragover-bad'); s.title=''; }); });
    div.addEventListener('dragover',e=>{
      if(!listDragId||listDragId===co.id) return;
      const src=COURSES.find(c=>c.id===listDragId); if(!src||courseGroup(src)!==courseGroup(co)) return;
      e.preventDefault(); const r=div.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2;
      div.classList.toggle('drop-before',!after); div.classList.toggle('drop-after',after);
    });
    div.addEventListener('dragleave',()=>div.classList.remove('drop-before','drop-after'));
    div.addEventListener('drop',e=>{
      if(!listDragId||listDragId===co.id) return;
      e.preventDefault(); const after=div.classList.contains('drop-after');
      div.classList.remove('drop-before','drop-after'); const id=listDragId; listDragId=null; dragCourseId=null;
      reorderCourse(id,co.id,after);
    });
    const editBtn=document.createElement('button');
    editBtn.className='course-edit-btn';
    editBtn.textContent='編輯';
    editBtn.dataset.cid=co.id;
    editBtn.onclick=function(e){ e.stopPropagation(); openEditModal(this.dataset.cid); };
    div.appendChild(editBtn);
    const delBtn=document.createElement('button');
    delBtn.className='course-del-btn';
    delBtn.textContent='刪除';
    delBtn.dataset.cid=co.id;
    delBtn.onclick=function(e){ e.stopPropagation(); deleteCourse(this.dataset.cid); };
    div.appendChild(delBtn);
    el.appendChild(div);
  }
  if(!visible) el.innerHTML='<div class="empty-course">沒有符合條件的課程</div>';
  const need=courses.filter(c=>!c.noSlot);
  const total=need.length, placed=need.filter(c=>isPlaced(c.id)).length;
  document.getElementById('sb-progress').textContent=`${placed}/${total}`;
}

function renderClassGrid(){
  const cls=cmap[selectedClassId];
  const container=document.getElementById('grid-area'); container.innerHTML='';
  if(!cls){ container.innerHTML='<div style="padding:20px;color:var(--text3)">尚無班級，請先在「管理班級」新增或匯入開課表</div>'; return; }
  const days=getClassDays(cls);
  const sectionLabel={
    day: '日間部（第1–13節，週一–週五）',
    eve: '進修部（平日第A–D節，週六第1–D節）',
    grad:'碩士班（第1–13節，週一–週五）',
    prof:'碩士在職班（第1–13節，週一–週六）',
  }[cls.type]||'';
  const lbl=document.createElement('div'); lbl.className='grid-section-label'; lbl.textContent=sectionLabel;
  container.appendChild(lbl);
  // 開課計畫的學分配置與備註
  const noSlotList=COURSES.filter(c=>c.classId===cls.id&&c.noSlot);
  if(cls.summary||cls.note||noSlotList.length){
    const info=document.createElement('div'); info.className='class-info';
    const parts=[];
    if(cls.summary) parts.push(`<b>學分配置</b>　${xe(cls.summary)}`);
    if(cls.note) parts.push(`<b>備註</b>　${xe(cls.note)}`);
    if(noSlotList.length) parts.push(`<b>不排入課表</b>　${noSlotList.map(c=>xe(c.name)+'('+c.credits+')').join('、')}`);
    info.innerHTML=parts.join('<br>');
    container.appendChild(info);
  }
  const tt=buildTimetable(getPeriodsConfig(cls), days, DAY_LABELS, cls.id, null);
  container.appendChild(tt);
}

function renderTeacherGrid(){
  const sel=document.getElementById('teacher-selector');
  // Always rebuild selector so teacher name/type edits are reflected
  sel.innerHTML='';
  for(const t of TEACHERS){
    const btn=document.createElement('button');
    btn.className=`teacher-chip${t.id===selectedTeacherId?' active':''}`;
    btn.id=`tchip-${t.id}`; btn.dataset.tid=t.id;
    btn.textContent=t.name+`(${t.type==='專任'?'專':'兼'})`;
    btn.onclick=()=>{ selectedTeacherId=t.id; renderTeacherGrid(); };
    sel.appendChild(btn);
  }
  // Update active + conflict status
  const conflictTids=new Set(conflicts.map(c=>c.tid));
  for(const chip of sel.querySelectorAll('.teacher-chip')){
    const tid=chip.dataset.tid;
    chip.className=`teacher-chip${tid===selectedTeacherId?' active':''}${conflictTids.has(tid)?' has-conflict':''}`;
  }

  const container=document.getElementById('teacher-grid-area'); container.innerHTML='';
  const t=tmap[selectedTeacherId];
  // Header: teacher name + load
  const lbl=document.createElement('div'); lbl.className='grid-section-label';
  lbl.style.paddingLeft='0';
  // Count load
  const cm=comap(); let totalSlots=0;
  for(const cls of CLASSES) for(const e of schedule[cls.id]){
    const co=cm[e.courseId]; if(co?.teachers.includes(selectedTeacherId)) totalSlots+=e.slots.length;
  }
  lbl.textContent=`${t?.name} ${t?.type}教師 ─ 本學期已排 ${totalSlots} 節`;
  container.appendChild(lbl);
  const tt=buildTimetable(TEACHER_PERIODS, ALL_DAYS_SAT, DAY_LABELS, null, selectedTeacherId);
  container.appendChild(tt);
}

function renderLoadView(){
  const cm=comap();
  const list=document.getElementById('load-list'); list.innerHTML='';
  const conflictTids=new Set(conflicts.map(c=>c.tid));
  const loadMap={};
  TEACHERS.forEach(t=>loadMap[t.id]=0);
  for(const cls of CLASSES) for(const e of schedule[cls.id]){
    const co=cm[e.courseId]; if(!co) continue;
    for(const tid of co.teachers) loadMap[tid]=(loadMap[tid]||0)+e.slots.length;
  }
  const maxLoad=Math.max(...Object.values(loadMap),1);

  const renderGroup=(teachers,label)=>{
    const g=document.createElement('div');
    g.style.cssText='font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:4px 0 6px;grid-column:1/-1;';
    g.textContent=label; list.appendChild(g);
    for(const t of teachers){
      const load=loadMap[t.id]||0;
      const hasC=conflictTids.has(t.id);
      const color=hasC?'#f56565':(t.type==='專任'?'#4f8ef7':'#f0b84a');
      const card=document.createElement('div');
      card.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;';
      if(hasC) card.style.borderColor='rgba(245,101,101,.5)';
      card.innerHTML=`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
          <div style="width:28px;height:28px;border-radius:50%;background:${color}22;color:${color};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">${t.name.slice(0,2)}</div>
          <div>
            <div style="font-size:12px;font-weight:500;">${t.name}</div>
            <div style="font-size:9px;color:var(--text3);">${t.type} · ${load}節</div>
          </div>
          ${hasC?`<div style="margin-left:auto;font-size:9px;color:var(--red2);">⚠ 衝堂</div>`:''}
        </div>
        <div style="height:3px;background:var(--border);border-radius:2px;">
          <div style="height:3px;width:${Math.round(load/maxLoad*100)}%;background:${hasC?'#f56565':color};border-radius:2px;transition:width .3s;"></div>
        </div>
      `;
      card.onclick=()=>{ selectedTeacherId=t.id; setView('teacher'); };
      list.appendChild(card);
    }
  };
  renderGroup(TEACHERS.filter(t=>t.type==='專任'),'專任教師');
  renderGroup(TEACHERS.filter(t=>t.type==='兼任'),'兼任教師');
}

function updateConflictUI(){
  const list=document.getElementById('conflict-list'); list.innerHTML='';
  if(conflicts.length===0){
    list.innerHTML='<div class="no-conflict">✓ 目前無衝堂</div>';
    document.getElementById('conflict-count').textContent='';
    document.getElementById('status-pill').className='status-pill ok';
    document.getElementById('status-txt').textContent='無衝堂';
  } else {
    document.getElementById('conflict-count').textContent=`${conflicts.length}筆`;
    document.getElementById('status-pill').className='status-pill warn';
    document.getElementById('status-txt').textContent=`${conflicts.length}衝堂`;
    for(const c of conflicts){
      const item=document.createElement('div'); item.className='conflict-item'; item.textContent=c.msg; list.appendChild(item);
    }
  }
  const need=slotCourses();
  const total=need.length, placed=need.filter(c=>isPlaced(c.id)).length;
  document.getElementById('s-placed').textContent=placed;
  document.getElementById('s-remain').textContent=total-placed;
  document.getElementById('s-conf').textContent=conflicts.length;
  document.getElementById('s-pct').textContent=(total?Math.round(placed/total*100):0)+'%';
}

function render(){
  renderClassTabs();
  renderCourseList();
  detectConflicts();
  if(currentView==='class') renderClassGrid();
  else if(currentView==='teacher') renderTeacherGrid();
  else if(currentView==='room') renderRoomGrid();
  else renderLoadView();
  saveLocal();
  if(window.cloudQueueSave) window.cloudQueueSave();
}

// ══════════════════════════════════════════
//  AUTO SAVE（瀏覽器 localStorage，依學期分開存）
// ══════════════════════════════════════════
function serialize(){
  return {version:3, exportedAt:new Date().toISOString(), semester:SEMESTER.code,
    teachers:TEACHERS, classes:CLASSES, rooms:ROOMS, courses:COURSES, schedule};
}
function applyData(data){
  TEACHERS.length=0; Object.keys(tmap).forEach(k=>delete tmap[k]);
  data.teachers.forEach(t=>{ TEACHERS.push(t); tmap[t.id]=t; });
  CLASSES.length=0; Object.keys(cmap).forEach(k=>delete cmap[k]);
  data.classes.forEach(c=>{ CLASSES.push(c); cmap[c.id]=c; });
  ROOMS.length=0; (data.rooms||[]).forEach(r=>ROOMS.push(r));
  COURSES=data.courses;
  COURSES.forEach(c=>{ if(!Array.isArray(c.teachers)) c.teachers=[]; });
  Object.keys(schedule).forEach(k=>delete schedule[k]);
  Object.assign(schedule,data.schedule||{});
  CLASSES.forEach(c=>{ if(!schedule[c.id]) schedule[c.id]=[]; });
  if(!cmap[selectedClassId]) selectedClassId=CLASSES[0]?.id||'';
  if(!tmap[selectedTeacherId]) selectedTeacherId=TEACHERS[0]?.id||'';
  if(!ROOMS.find(r=>r.id===selectedRoomId)) selectedRoomId=ROOMS[0]?.id||null;
}
let saveFailed=false;
let undoStack=[];
let currentSnapshot=null;
let historySuspended=false;
function dataSnapshot(){
  const d=serialize(); delete d.exportedAt;
  return JSON.stringify(d);
}
function undoScheduleChange(){
  if(!undoStack.length) return;
  const target=undoStack.pop();
  historySuspended=true;
  try { applyData(JSON.parse(target)); render(); showToast('✓ 已復原上一次資料變更'); }
  finally { historySuspended=false; updateUndoBtn(); }
}
function resetUndoHistory(){
  undoStack=[];
  currentSnapshot=dataSnapshot();
  updateUndoBtn();
}
function updateUndoBtn(){ const btn=document.getElementById('undo-btn'); if(!btn) return; btn.disabled=!undoStack.length; btn.textContent=undoStack.length?`↶ 復原 (${undoStack.length})`:'↶ 復原'; btn.title=undoStack.length?`可再復原 ${undoStack.length} 步（最多保留 30 步）`:'沒有可復原的變更'; }
function saveLocal(){}
function setSaveInd(txt){
  const el=document.getElementById('save-ind'); if(!el) return;
  el.firstChild.nodeValue=txt;
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data.teachers||!data.classes||!data.courses) return false;
    applyData(data); return true;
  }catch(e){ return false; }
}
async function resetToDefault(){
  if(!await uiConfirm(`確定重設？\n將清除瀏覽器中 ${SEMESTER.code} 的自動儲存，回到開課計畫的預設課程，已排的課表也會清空。\n（建議先按「匯出備份」）`)) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  applyData({...JSON.parse(JSON.stringify(DEFAULT_DATA)), schedule:{}});
  resetUndoHistory(); render(); showToast('已重設為開課計畫預設資料');
}
